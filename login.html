
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login: Conta Dell</title>
<link rel="stylesheet" href="./login.css">
</head>

<body>
<header>
    <nav class="nave">
            
            <a href="./index.html"><img src="./imagens/Dell_Technologies-Logo.wine.png" alt="logodel" id="logo"></a>
            <div id="dive">
        <a href="./notebooks.html" class="navega">Notebooks</a>
        <a href="./monitores.html" class="navega">Monitores</a>
        <a href="./gamer" class="navega">Gamer</a>
        <a href="./acessorios.html" class="navega">Acessórios para PC</a>
        <a href="./login.html" class="navega">Login</a>
    </div>
        </nav>
</header>
    <main>
        <form>
        
            <h1>Fazer Login Conta Dell</h1>
            <p>Entre na sua conta</p>
       

        

            <div>
                <label for="email">E-mail:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    required
                >
            </div>

            <div>
                <label for="senha">Senha:</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    required
                >
            </div>

            <button type="submit">Entrar</button>

        </form>

        <nav>
            <p>
                <a href="/recuperar-senha">
                    Esqueceu sua senha?
                </a>
            </p>

            <p>
                Não tem conta?
                <a href="/cadastro">Cadastre-se</a>
            </p>
        </nav>

        <footer>
            <small>&copy; 2026 - Sistema de Login</small>
        </footer>
    </main>

</body>

</html>

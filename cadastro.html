
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Conta Dell</title>
    <link rel="stylesheet" href="./cadastro.css">
</head>

<body>
    <header>
        
        <nav class="nave">
            
            <a href="./index.html"><img src="./imagens/Dell_Technologies-Logo.wine.png" alt="logodel" id="logo"></a>
            <div id="dive">
        
        <a href="./monitores.html" class="navega">Monitores</a>
        <a href="./gamer.html" class="navega"><p class="paragrafo">Gamer </p></a>
        <a href="./acessorios.html" class="navega">Acessórios para PC</a>
        <a href="./login.html" class="navega">Login</a>
    </div>
        </nav>
    </header>
    <main class="container">
    <section class="cadastro">
        <h1>Cadastro de Conta Dell</h1>
        <div id="artigo">

        
        <form>
            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" name="nome"
                   placeholder="Digite seu nome" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email"
                   placeholder="Digite seu e-mail" required>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha"
                   placeholder="Crie uma senha" required>

            <label for="confirmar">Confirmar senha:</label>
            <input type="password" id="confirmar" name="confirmar"
                   placeholder="Repita sua senha" required>

            <button type="submit">Cadastrar</button>
        </form>
        </div>
    </section>
</main>
</body>
</html>
